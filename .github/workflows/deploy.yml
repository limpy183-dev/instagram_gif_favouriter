name: Deploy to GitHub Pages

on:
  push:
    branches: ["overhaul-ui"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GIPHY_API_KEY_1: ${{ secrets.VITE_GIPHY_API_KEY_1 }}
          VITE_GIPHY_API_KEY_2: ${{ secrets.VITE_GIPHY_API_KEY_2 }}
          VITE_GIPHY_API_KEY_3: ${{ secrets.VITE_GIPHY_API_KEY_3 }}
          VITE_GIPHY_API_KEY_4: ${{ secrets.VITE_GIPHY_API_KEY_4 }}
          VITE_GIPHY_API_KEY_5: ${{ secrets.VITE_GIPHY_API_KEY_5 }}
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
        run: pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
